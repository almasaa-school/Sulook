// 🛡️ درع الحماية الشامل (يمنع مسح البيانات ويحدث المستويات)
function fixDB(obj){
  if(!obj) return;
  if(!obj.config) obj.config={...DEF_CFG};
  Object.keys(DEF_CFG).forEach(k=>{if(obj.config[k]===undefined)obj.config[k]=DEF_CFG[k]});
  
  ['health','referrals','records','followups','resolved'].forEach(k=>{if(!obj[k] || !Array.isArray(obj[k]))obj[k]=[]});
  
  // إصلاح المستخدمين
  if(!obj.users || !Array.isArray(obj.users) || obj.users.length===0) {
      obj.users=[{id:'U1',name:'مدير النظام',title:'مدير',username:'almasaa',password:'',isAdmin:true},{id:'U2',name:'وكيل المدرسة',title:'وكيل',username:'wakil',password:'',isAdmin:false}];
  }

  // إصلاح السلوكيات وإجبارها على أن تكون نشطة وتحديث مستوياتها لتطابق اللائحة
  if(!obj.behaviors || !Array.isArray(obj.behaviors)) obj.behaviors=[];
  DEF_BEH.forEach(def => {
      let existing = obj.behaviors.find(b => b.id === def.id);
      if(!existing) {
          obj.behaviors.push({...def, active: true});
      } else {
          existing.active = true; 
          existing.level = def.level; // إجبار التحديث للمستوى الصحيح
          if(!existing.cat) existing.cat = def.cat;
      }
  });

  // إصلاح الإجراءات
  if(!obj.actions || !Array.isArray(obj.actions) || obj.actions.length===0) obj.actions=[];
  DEF_ACT.forEach(def => {
      if(!obj.actions.find(a => a.id === def.id)) {
          obj.actions.push({...def});
      }
  });

  // إصلاح الطلبة
  if(!obj.students || !Array.isArray(obj.students) || obj.students.length === 0){
      obj.students = DEF_STU.map((x,i)=>({id:'S'+String(i+1).padStart(3,'0'),name:x[0],grade:x[1],section:x[2],phone:'',guardian:''}));
  }
}

async function cloudPush(){
  if(!sbClient)return;
  if(CLOUD.syncing){CLOUD.pending=true;return}
  CLOUD.syncing=true;upCloud('⬆️ رفع...');
  try{
    const nowIso=new Date().toISOString();
    const {error}=await sbClient.from('app_data').upsert({id:'main',payload:DB,updated_at:nowIso,updated_by:USER?USER.name:''});
    if(!error)CLOUD.last=new Date(nowIso).getTime();
    upCloud(error?'❌ فشل الرفع':'✅ متزامن');
  }catch(e){upCloud('⚠️ خطأ')}
  CLOUD.syncing=false;
  if(CLOUD.pending){CLOUD.pending=false;cloudPush()}
}
async function cloudPull(silent){
  if(!sbClient)return false;
  if(!silent)upCloud('⬇️ تحميل...');
  try{
    const {data,error}=await sbClient.from('app_data').select('payload,updated_at').eq('id','main').single();
    if(error||!data||!data.payload)return false;
    const p=data.payload;
    const remoteTs=new Date(data.updated_at).getTime();
    if(silent&&remoteTs<=CLOUD.last)return false;
    if(!p.students||!Array.isArray(p.students))return false;
    const cloudHasData=p.students.length>0||(p.records&&p.records.length>0)||(p.users&&p.users.length>0)||(p.behaviors&&p.behaviors.length>0);
    const localHasData=DB.students.length>0||DB.records.length>0||DB.users.length>0;
    if(!cloudHasData&&localHasData){upCloud('⬆️ رفع أولي...');await cloudPush();return false}
    if(!cloudHasData&&!localHasData){upCloud('✅ جاهز');return false}
    
    DB=p;
    fixDB(DB); 
    
    localStorage.setItem(KEY,JSON.stringify(DB));
    CLOUD.last=remoteTs;
    if(!silent)upCloud('✅ محدّث');
    return true;
  }catch(e){console.warn('cloudPull:',e);return false}
}
function upCloud(txt){const el=document.getElementById('cloudStatus');if(el)el.textContent=txt}
async function forcePull(){
  if(!sbClient){toast('Supabase غير مهيأ','err');return}
  if(!confirm('سيتم استبدال البيانات المحلية بالنسخة السحابية. متابعة؟'))return;
  const ok=await cloudPull(false);

}

function login(){

    const u=conv(document.getElementById('lgU').value || '');

    if(!u){
      e.textContent='❌ أدخل اسم المستخدم';

      setTimeout(()=>e.classList.add('hidden'),4000);
      return;
    }
    if(!DB || !DB.users){ alert('خطأ في تحميل البيانات، يرجى تحديث الصفحة'); return; }
    
    const user=DB.users.find(x=>x.username===u);

      e.textContent='❌ اسم المستخدم غير موجود';
      e.classList.remove('hidden');
      setTimeout(()=>e.classList.add('hidden'),4000);
      return;
    }
    
    if(user.password&&user.password.trim()!==''&&user.password!==p){
      e.textContent='❌ كلمة المرور غير صحيحة';
      e.classList.remove('hidden');

      return;

}

    const iw=pw-10,ih=(c.height*iw)/c.width;
    if(ih<=ph-10)p.addImage(img,'PNG',5,5,iw,ih);
    else{let rm=ih,of=0;while(rm>0){const phh=Math.min(ph-10,rm);const c2=document.createElement('canvas');c2.width=c.width;c2.height=(phh/ih)*c.height;c2.getContext('2d').drawImage(c,0,of*c.height/ih,c.width,c2.height,0,0,c.width,c2.height);p.addImage(c2.toDataURL('image/png'),'PNG',5,5,iw,phh);of+=phh;rm-=phh;if(rm>0)p.addPage()}}
    const b=p.output('blob');const file=new File([b],fn,{type:'application/pdf'});
    document.body.removeChild(ifr);
    if(navigator.canShare&&navigator.canShare({files:[file]})){
      try{await navigator.share({files:[file],text:msg||'',title:fn});toast('✅ قائمة المشاركة')}
      catch(e){if(e.name!=='AbortError'){const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=fn;document.body.appendChild(a);a.click();document.body.removeChild(a)}}
    }else{
      const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=fn;document.body.appendChild(a);a.click();document.body.removeChild(a);
      toast('💾 تم تنزيل PDF');setTimeout(()=>wa(phone,msg||''),500);
    }
  }catch(e){if(ifr.parentNode)document.body.removeChild(ifr);toast('فشل PDF','err')}
}

// 🧠 محرك التدرج الذكي (مطابق تماماً للائحة 234/2017)
function suggestAction(){
  if(!E.sid || !E.bid) return;
  const b=gB(E.bid);
  if(!b) return;
  
  const pastIncidents = DB.records.filter(r => r.studentId === E.sid && r.behaviorId === E.bid);
  const occurrences = pastIncidents.length; 
  
  let suggestedActId = 'A1';
  let msg = '';
  let isAbsenceEquiv = false;
  
  // 1. معالجة التأخير (المادة 29 و 30)
  if (b.id === 'B_T') {
      const totalTardies = occurrences + 1;
      
      if (totalTardies === 1) { suggestedActId = 'A1'; msg = `✨ تأخر رقم 1. الإجراء: نصح شفهي.`; }
      else if (totalTardies === 2) { suggestedActId = 'A2'; msg = `✨ تأخر رقم 2. الإجراء: نصح ورقي.`; }
      else if (totalTardies === 3) { suggestedActId = 'A3'; msg = `✨ تأخر رقم 3. الإجراء: تنبيه ورقي.`; }
      else if (totalTardies === 4) { suggestedActId = 'A4'; msg = `✨ تأخر رقم 4. الإجراء: إنذار وتعهد.`; }
      else if (totalTardies === 5) { 
          suggestedActId = 'A5'; 
          isAbsenceEquiv = true;
          msg = `<span style="color:#dc2626">⚠️ تنبيه هام:</span> هذا التأخر رقم 5. ووفقاً للائحة يُعد غياباً ليوم دراسي كامل. الإجراء: دراسة حالة.`;
      } else {
          isAbsenceEquiv = true;
          const absDays = Math.floor(totalTardies / 5);
          if (absDays === 1) suggestedActId = 'A2'; // 2 days absence (level 1)
          else if (absDays === 2) suggestedActId = 'A3'; // 5 days absence (level 2)
          else if (absDays === 3) suggestedActId = 'A4'; // 8 days absence (level 3)
          else if (absDays === 4) suggestedActId = 'A5'; // 10 days absence (level 4)
          else if (absDays >= 5) suggestedActId = 'A9'; // 15+ days absence (level 5)
          
          msg = `<span style="color:#dc2626">⚠️ تنبيه هام:</span> هذا التأخر رقم ${totalTardies}، ويعادل ${absDays} يوم غياب. تم تصعيد الإجراء إلى إجراءات الغياب بناءً على اللائحة.`;
      }
  } 
  // 2. معالجة الغياب (المادة 33)
  else if (b.cat === 'غياب') {
      if(b.id === 'B_G1') suggestedActId = 'A2'; // يومان
      if(b.id === 'B_G2') suggestedActId = 'A3'; // 5 أيام
      if(b.id === 'B_G3') suggestedActId = 'A4'; // 8 أيام
      if(b.id === 'B_G4') suggestedActId = 'A5'; // 10 أيام
      if(b.id === 'B_G5') suggestedActId = 'A9'; // 15 يوم
      if(b.id === 'B_G6') suggestedActId = 'A10'; // 30 يوم
      if(b.id === 'B_G7') suggestedActId = 'A12'; // 45 يوم
      msg = `✨ تم اقتراح الإجراء وفقاً لجدول الغياب في اللائحة.`;
  } 
  // 3. التدرج العام لبقية السلوكيات (وفق المادة 39)
  else {
      // تم إعادة ضبط المستويات لتطابق البنود (أ=1، ب=2، ج=3، د=4، هـ=5، و=6، ز=7)
      let escalatedLevel = (b.level || 1) + occurrences;
      if (escalatedLevel > 7) escalatedLevel = 7;
      
      if(escalatedLevel === 1) suggestedActId = 'A2'; // (بند أ) نصح ورقي
      else if(escalatedLevel === 2) suggestedActId = 'A3'; // (بند ب) تنبيه
      else if(escalatedLevel === 3) suggestedActId = 'A4'; // (بند ج) إنذار
      else if(escalatedLevel === 4) suggestedActId = 'A5'; // (بند د) دراسة حالة
      else if(escalatedLevel === 5) suggestedActId = 'A6'; // (بند هـ) فصل 3 أيام
      else if(escalatedLevel === 6) suggestedActId = 'A8'; // (بند و) رفع للجنة 5-10 أيام
      else if(escalatedLevel >= 7) suggestedActId = 'A11'; // (بند ز) نقل/فصل نهائي
      
      if(occurrences > 0) {
        msg = `✨ تدرج تلقائي بناءً على:<br>
        • مستوى السلوك الأساسي: ${b.level}<br>
        • مرات التكرار السابقة: ${occurrences}<br>
        • المستوى النهائي المقترح: ${escalatedLevel}`;
      } else {
        msg = `✨ هذا هو تسجيل المرة الأولى لهذا السلوك (المستوى ${b.level}).`;
      }
  }

  if(!gA(suggestedActId)) suggestedActId = 'A1';
  
  E.aid=suggestedActId;
  const actSelect=document.getElementById('fA');
  const suggestMsg=document.getElementById('suggestMsg');
  
  if(actSelect){
    actSelect.value=E.aid;
    actSelect.style.borderColor='#10B981'; 
    setTimeout(()=>actSelect.style.borderColor='#e2e8f0', 1500);
  }
  
  if(suggestMsg) {
    suggestMsg.style.display='block';
    suggestMsg.innerHTML = msg;
  }
  
  onActChange();
}

function saveRec(){
  if(!E.sid){toast('اختر الطالب','err');return}
  if(!E.bid){toast('اختر السلوك','err');return}
  if(!E.aid){toast('اختر الإجراء','err');return}
  const uid=document.getElementById('fU')?.value||E.uid||DB.users[0]?.id;
  if(!uid){toast('اختر المستخدم','err');return}
  
  const b=gB(E.bid);
  let finalBehName = b ? b.name : '';
  let finalPoints = b ? b.points : 0;
  let finalRegText = '';
  
  if(E.bid==='B_OTHER'){
    finalBehName = E.customBeh || 'سلوك غير محدد';
  }

  if(E.aid==='CUSTOM'){
    finalRegText = 'إجراء مخصص (غير مذكور صراحة في النص اللائحي)';
  } else {
    const a = gA(E.aid);
    finalRegText = a ? a.desc : '';
  }

  E.uid=uid;
  const u=gU(uid);
  
  DB.followups=DB.followups.filter(f=>f.studentId!==E.sid||f.resolved);
  
  const pastIncidents = DB.records.filter(r => r.studentId === E.sid && r.behaviorId === E.bid);
  const occurrenceCount = pastIncidents.length + 1;

  let isAbsenceEquiv = false;
  if (E.bid === 'B_T' && occurrenceCount >= 5) {
      isAbsenceEquiv = true;
  }

  const r={
    id:uid0('R'), studentId:E.sid,
    behaviorId:E.bid, behaviorName:finalBehName,
    actionId:E.aid, actionName:(E.aid==='CUSTOM'? (E.customAct||'إجراء مخصص') : (gA(E.aid)?.name||'')),
    regulationText:finalRegText,
    userId:uid, userName:u?u.name:'', userTitle:u?u.title:'',
    points:finalPoints, note:E.note, actionNote:E.an, createdAt:Date.now(),
    occurrenceCount: occurrenceCount,
    reviewedBy: E.reviewedBy,
    isAbsenceEquiv: isAbsenceEquiv
  };
  
  DB.records.unshift(r);
  save();toast('✓ تم الحفظ');
  showActions(r.id);
  E={sid:'',bid:'',aid:'',note:'',uid:DB.users[0]?.id||'',an:'',customBeh:'',customAct:'',reviewedBy:''};
  render();
}

function ana(){
  let r=DB.records.slice();

  if(AF.g)r=r.filter(x=>{const s=gS(x.studentId);return s&&s.grade===+AF.g});
  if(AF.sc)r=r.filter(x=>{const s=gS(x.studentId);return s&&s.section===+AF.sc});
  const bc={};r.forEach(x=>{const k=x.behaviorName||'—';bc[k]=(bc[k]||0)+1});
  const b=Object.entries(bc).map(([n,c])=>({name:n,count:c})).sort((a,b)=>b.count-a.count);
  const gc={};r.forEach(x=>{const s=gS(x.studentId);if(s)gc[s.grade]=(gc[s.grade]||0)+1});
  const g=GR.map(x=>({grade:x,count:gc[x]||0}));
  const sc={};r.forEach(x=>{const s=gS(x.studentId);if(!s)return;const k=s.grade+'|'+s.section;if(!sc[k])sc[k]={grade:s.grade,section:s.section,count:0};sc[k].count++});
  const sec=Object.values(sc).sort((a,b)=>b.count-a.count);

  const a=Object.entries(ac).map(([n,c])=>({name:n,count:c})).sort((a,b)=>b.count-a.count);

  const u=Object.entries(uc).map(([sid,c])=>({student:gS(sid),count:c})).filter(x=>x.student).sort((a,b)=>b.count-a.count).slice(0,10);
  return {b,g,sec,a,u,total:r.length};
}

 #999;padding:6px">الإجراء</th></tr></thead><tbody>${rows||'<tr><td colspan="4" style="border:1px solid #999;padding:15px;text-align:center">لا مخالفات</td></tr>'}</tbody></table>${rFtr()}</div>`}

/* ============ بدء ============ */
async function boot(){
  try {
    nav();
    go('home');
    setTimeout(async ()=>{
      if(!CLOUD.enabled){upCloud('📴 محلي');return}
      upCloud('⬇️ تحميل...');
      const ok=await cloudPull(false);
      if(ok){render();upCloud('✅ متزامن')}
      else{upCloud('✅ جاهز')}
      if(!window._syncTimer){window._syncTimer=setInterval(async()=>{
        if(CLOUD.syncing||!navigator.onLine)return;
        const changed=await cloudPull(true);
        const busy=document.querySelector('#mdl .mdl')||document.querySelector('.dd:not(.hidden)')||pg==='entry'||['INPUT','SELECT','TEXTAREA'].includes(document.activeElement&&document.activeElement.tagName);
        if(changed&&!busy){render();nav()}
      },15000)}
    },500);
    setInterval(()=>{
      const e=document.getElementById('bkSt');
      if(!e)return;
      const m=BK.last?Math.floor((Date.now()-BK.last)/60000):null;
      e.textContent=(BK.enabled?'🟢':'⏸️')+' '+(m===null?'—':m<1?'الآن':'قبل '+m+'د')+' · '+BK.n+'/'+BK.int;
    },10000);
  } catch(e) {
    console.error('Boot error:', e);
  }
}

function ensure(){

async function dvLoad(){
  if(!sbClient){DV.err='الاتصال بالسحابة غير متاح';DV.loaded=true;return false}
  try{
    let r=await sbClient.from('app_data').select('id,payload').like('id','dv%');
    if(r.error)r=await sbClient.from('app_data').select('id,payload').neq('id','main');
    if(r.error){DV.err='تعذر تحميل المخالفات: '+(r.error.message||'');DV.loaded=true;return false}
    DV.err='';
    DV.items=(r.data||[]).filter(x=>/^dv/.test(x.id)&&x.payload&&x.payload.createdAt&&x.payload.status!=='deleted').map(x=>Object.assign({},x.payload,{id:x.id})).sort((a,b)=>b.createdAt-a.createdAt);
    DV.loaded=true;return true;
  }catch(e){DV.err='تعذر تحميل المخالفات';DV.loaded=true;return false}
}
async function dvSetStatus(id,status){
  const it=DV.items.find(i=>i.id===id);if(!it||!sbClient)return;
  it.status=status;
  const {id:_x,...pl}=it;
  try{await sbClient.from('app_data').upsert({id,payload:pl,updated_at:new Date().toISOString(),updated_by:USER?USER.name:''})}catch(e){}
}
async function dvRemove(id){
  let ok=false;
  try{const r=await sbClient.from('app_data').delete().eq('id',id).select();ok=!r.error&&r.data&&r.data.length>0}catch(e){}
  if(!ok){await dvSetStatus(id,'deleted')}

}

wa=function(phone,msg){
  const ar='٠١٢٣٤٥٦٧٨٩',fa='۰۱۲۳۴۵۶۷۸۹';
  let c=String(phone||'').replace(/[٠-٩]/g,d=>ar.indexOf(d)).replace(/[۰-۹]/g,d=>fa.indexOf(d)).replace(/\D/g,'');
  if(!c){toast('لا يوجد رقم ولي أمر مسجل','err');return}
  if(c.startsWith('00'))c=c.slice(2);
  else if(c.startsWith('0'))c=c.replace(/^0+/,'');
  if(!c.startsWith('968')&&c.length<=8)c='968'+c;
  const text=encodeURIComponent(msg||'');
  const mobile=/Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent);

    // على الجوال: فتح مباشر في نفس النافذة ليتحول لتطبيق الواتساب (لا يتأثر بحجب النوافذ)

/* ---- الإعدادات: اسم ومسمى مساعد المدير ---- */
const _rs6=renderSettings;
renderSettings=function(){
  const html=_rs6.apply(this,arguments);
  const card=`<div class="bg-white rounded-2xl p-6 shadow-sm space-y-3"><h3 style="font-weight:900;padding-right:12px;border-right:4px solid var(--p);margin-bottom:8px">🧑‍💼 مساعد المدير (يظهر في يمين تذييل الطباعة)</h3><div style="display:grid;grid-template-columns:1fr 1fr;gap:16px"><div><label style="display:block;font-size:12px;font-weight:bold;margin-bottom:4px">المسمى</label><input value="${esc(aTitle())}" onchange="DB.config.assistantTitle=this.value;save();toast('✓ تم الحفظ')" class="w-full rounded-xl border-2 border-slate-200 px-3 py-2 text-sm"></div><div><label style="display:block;font-size:12px;font-weight:bold;margin-bottom:4px">الاسم</label><input value="${esc(aName())}" onchange="DB.config.assistantName=this.value;save();toast('✓ تم الحفظ')" class="w-full rounded-xl border-2 border-slate-200 px-3 py-2 text-sm"></div></div></div>`;
  return html.replace('<button onclick="svSet()"',card+'<button onclick="svSet()"');
};

/* ---- معاينة تقرير الوحدة الصحية قبل الطباعة ---- */
if(typeof pvShow==='function'){
  const orig=pHR;
  pHR=function(){
    const o=prt;
    prt=function(h){prt=o;pvShow(h)};
    try{return orig.apply(this,arguments)}finally{prt=o}
  };
}
})();
